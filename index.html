<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle, #0c1a2b, #01060d);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        /* Universo de estrellas fijas */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: blink 2s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* Interfaz de usuario inicial */
        .interface-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 35px 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            z-index: 10;
            color: white;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: all 0.5s ease;
        }
        h1 {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #050b14;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        
        /* Contenedor Cósmico completo */
        #universe-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* Elemento flotante unificado */
        .botanic-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatUp 7s forwards linear;
        }

        /* Burbuja de Texto de Amor */
        .flower-msg {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            margin-bottom: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* Flor integrada básica */
        .girasol { width: 50px; height: 50px; position: relative; }
        .girasol .center { position: absolute; width: 16px; height: 16px; background: #3d2203; border-radius: 50%; top: 17px; left: 17px; z-index: 2; }
        .girasol .petal { position: absolute; width: 6px; height: 20px; background: #ffd700; border-radius: 50% 50% 40% 40%; top: 0; left: 22px; transform-origin: bottom center; }

        /* Rotaciones de pétalos */
        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        .heart { position: absolute; font-size: 20px; color: #ff3366; animation: simpleFloat 5s forwards linear; }
        .sparkle { position: absolute; font-size: 16px; color: #fff; text-shadow: 0 0 8px #ffd700; animation: simpleFloat 4s forwards linear; }

        /* Animación fluida hacia arriba para las flores con mensaje */
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1) rotate(180deg); opacity: 0; }
        }

        /* Animación complementaria simple para brillos/corazones */
        @keyframes simpleFloat {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(-15vh) opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars-bg"></div>
    <div id="universe-container"></div>

    <!-- Carta inicial limpia -->
    <div class="interface-card" id="card-inicio">
        <h1>Para mi gordis ✨</h1>
        <p>Te amo mucho y sé que aunque no sea físico, espero que te guste este universo.</p>
        <button class="btn" onclick="crearUniversoMensajes()">Entrar al Universo 🌻</button>
    </div>

    <script>
        const frasesAmor = [
            "Te amo mucho ❤️", 
            "Eres mi gordis linda ✨", 
            "Mi lugar favorito eres tú 🌻", 
            "Me haces muy feliz 🥰", 
            "Un universo para ti 🌌", 
            "Eres única y especial 💛", 
            "Gracias por existir 👑", 
            "Te adoro con el corazón 🌹"
        ];

        // Fondo de estrellas
        const starsBg = document.getElementById('stars-bg');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = star.style.height = Math.random() * 2 + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsBg.appendChild(star);
        }

        function crearUniversoMensajes() {
            // Escondemos la tarjeta inicial
            document.getElementById('card-inicio').style.display = 'none';

            const contenedor = document.getElementById('universe-container');

            // Generar flores con mensajes
            setInterval(() => {
                const randomChoice = Math.random();
                const xPos = Math.random() * 90 + 'vw';

                if (randomChoice < 0.50) {
                    const grupo = document.createElement('div');
                    grupo.classList.add('botanic-group');
                    grupo.style.left = xPos;
                    grupo.style.animationDelay = Math.random() * 1 + 's';

                    // Mensaje
                    const fraseRandom = frasesAmor[Math.floor(Math.random() * frasesAmor.length)];
                    const burbuja = document.createElement('div');
                    burbuja.classList.add('flower-msg');
                    burbuja.innerText = fraseRandom;
                    grupo.appendChild(burbuja);

                    // Flor
                    const flor = document.createElement('div');
                    flor.classList.add('girasol');
                    flor.innerHTML = `
                        <div class="center"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                    `;
                    grupo.appendChild(flor);

                    contenedor.appendChild(grupo);
                    setTimeout(() => grupo.remove(), 7000);

                } else if (randomChoice < 0.80) {
                    const corazon = document.createElement('div');
                    corazon.classList.add('heart');
                    corazon.innerHTML = '❤️';
                    corazon.style.left = xPos;
                    contenedor.appendChild(corazon);
                    setTimeout(() => corazon.remove(), 5000);
                } else {
                    const brillo = document.createElement('div');
                    brillo.classList.add('sparkle');
                    brillo.innerHTML = '✨';
                    brillo.style.left = xPos;
                    contenedor.appendChild(brillo);
                    setTimeout(() => brillo.remove(), 4000);
                }

            }, 300);
        }
    </script>
</body>
</html>
