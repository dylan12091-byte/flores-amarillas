<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle, #0d1b2a, #010811);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        /* Estrellas de fondo (Universo) */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: blink 2s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* Contenedor de Interfaz */
        .interface-card {
            background: rgba(255, 255, 255, 0.07);
            padding: 35px 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            z-index: 10;
            color: white;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #050b14;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.6);
        }
        /* Carta con el mensaje final oculto */
        #carta-amor {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            animation: mostrarCarta 1s forwards ease-out;
            animation-delay: 0.3s;
        }
        @keyframes mostrarCarta {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* Contenedor de efectos flotantes */
        #container-efectos {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }
        /* Renderizado de la flor */
        .flower {
            position: absolute;
            width: 80px;
            height: 80px;
            animation: flotarEfecto 7s forwards linear;
        }
        .center {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #4a2c00;
            border-radius: 50%;
            top: 28px;
            left: 28px;
            z-index: 2;
            box-shadow: inset 0 0 5px #000;
        }
        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .petal {
            position: absolute;
            width: 12px;
            height: 32px;
            background: #ffd700;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 4px;
            left: 34px;
            transform-origin: bottom center;
            box-shadow: 0 0 4px rgba(255, 165, 0, 0.5);
        }
        /* Rotaciones de pétalos */
        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(30deg); }
        .petal:nth-child(3) { transform: rotate(60deg); }
        .petal:nth-child(4) { transform: rotate(90deg); }
        .petal:nth-child(5) { transform: rotate(120deg); }
        .petal:nth-child(6) { transform: rotate(150deg); }
        .petal:nth-child(7) { transform: rotate(180deg); }
        .petal:nth-child(8) { transform: rotate(210deg); }
        .petal:nth-child(9) { transform: rotate(240deg); }
        .petal:nth-child(10) { transform: rotate(270deg); }
        .petal:nth-child(11) { transform: rotate(300deg); }
        .petal:nth-child(12) { transform: rotate(330deg); }

        /* Estilos para los Corazones y Brillos adicionales */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #ff3366;
            filter: drop-shadow(0 0 8px rgba(255, 51, 102, 0.6));
            animation: flotarEfecto 6s forwards linear;
        }
        .sparkle {
            position: absolute;
            font-size: 18px;
            color: #ffeb3b;
            filter: drop-shadow(0 0 10px #ffeb3b);
            animation: flotarEfecto 5s forwards linear;
        }

        /* Animación unificada para flotar hacia arriba con balanceo */
        @keyframes flotarEfecto {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-15vh) translateX(100px) scale(0.9) rotate(360deg);
                opacity: 0;
            }
        }
        /* Ocultar el reproductor de música de fondo */
        #player-wrapper {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stars" id="stars-bg"></div>
    <div id="container-efectos"></div>

    <!-- Pantalla de inicio personalizada -->
    <div class="interface-card" id="card-inicio">
        <h1>Para mi gordis ✨</h1>
        <p>Presiona el botón para abrir tu regalo virtual.</p>
        <button class="btn" onclick="crearUniverso()">Abrir Universo 🌻</button>
    </div>

    <!-- Carta con tu mensaje dedicado -->
    <div class="interface-card" id="carta-amor">
        <h1>Para alguien muy especial 💛</h1>
        <p>Te amo mucho y sé que aunque no sea físico, espero que te guste.</p>
    </div>

    <!-- Contenedor oculto para la música vía YouTube API -->
    <div id="player-wrapper">
        <div id="youtube-player"></div>
    </div>

    <script>
        // Cargar el script de la API de YouTube de forma asíncrona
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: 'uS3vA2SgSok', // ID del tema Flores Amarillas de Floricienta
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'uS3vA2SgSok'
                }
            });
        }

        // Generar fondo de estrellas estáticas de inmediato
        const starsBg = document.getElementById('stars-bg');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsBg.appendChild(star);
        }

        function crearUniverso() {
            // Intercambiar pantallas sin bloqueos
            document.getElementById('card-inicio').style.display = 'none';
            document.getElementById('carta-amor').style.display = 'block';

            // Intentar reproducir la música de YouTube de manera segura
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }

            const contenedor = document.getElementById('container-efectos');

            // Generador continuo de elementos flotantes
            setInterval(() => {
                const randomChoice = Math.random();
                const xPos = Math.random() * 100 + 'vw';
                const delay = Math.random() * 2;

                if (randomChoice < 0.4) {
                    const flor = document.createElement('div');
                    flor.classList.add('flower');
                    flor.style.left = xPos;
                    flor.style.animationDelay = delay + 's';
                    flor.innerHTML = `
                        <div class="center"></div>
                        <div class="petals">
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                        </div>
                    `;
                    contenedor.appendChild(flor);
