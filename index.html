<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle, #0c1a2b, #01060d);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        /* Universo de estrellas fijas */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: blink 2s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* Interfaz de usuario inicial */
        .interface-card {
            background: rgba(255, 255, 255, 0.06);
            padding: 35px 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            z-index: 10;
            color: white;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        h1 {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #050b14;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
        
        /* Contenedor Cósmico completo */
        #universe-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* --- ELEMENTOS DEL UNIVERSO FLOTANTE --- */
        .botanic-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatInSpace 9s forwards linear;
        }

        /* Burbuja de Texto de Amor */
        .flower-msg {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 1. Girasol */
        .girasol { width: 60px; height: 60px; position: relative; }
        .girasol .center { position: absolute; width: 18px; height: 18px; background: #3d2203; border-radius: 50%; top: 21px; left: 21px; z-index: 2; }
        .girasol .petal { position: absolute; width: 8px; height: 24px; background: #ffd700; border-radius: 50% 50% 40% 40%; top: 0; left: 26px; transform-origin: bottom center; }

        /* 2. Margarita Amarilla */
        .margarita { width: 55px; height: 55px; position: relative; }
        .margarita .center { position: absolute; width: 14px; height: 14px; background: #f39c12; border-radius: 50%; top: 20px; left: 20px; z-index: 2; }
        .margarita .petal { position: absolute; width: 5px; height: 22px; background: #fff200; border-radius: 30%; top: 2px; left: 25px; transform-origin: bottom center; }

        /* Decoraciones sueltas */
        .heart { position: absolute; font-size: 20px; color: #ff3366; animation: pureFloat 6s forwards linear; }
        .sparkle { position: absolute; font-size: 16px; color: #fff; text-shadow: 0 0 8px #ffd700; animation: pureFloat 5s forwards linear; }

        /* Animación para que las flores viajen por el universo en 360° */
        @keyframes floatInSpace {
            0% {
                transform: translate(var(--startX), var(--startY)) scale(0.1) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--endX), var(--endY)) scale(1.1) rotate(280deg);
                opacity: 0;
            }
        }

        /* Animación complementaria simple para brillos/corazones */
        @keyframes pureFloat {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-15vh) translateX(50px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars-bg"></div>
    <div id="universe-container"></div>

    <!-- Carta inicial limpia -->
    <div class="interface-card" id="card-inicio">
        <h1>Para mi gordis ✨</h1>
        <p>Te amo mucho y sé que aunque no sea físico, espero que te guste este universo.</p>
        <button class="btn" onclick="crearUniversoMensajes()">Entrar al Universo 🌻</button>
    </div>

    <script>
        // Lista de frases románticas que llevará cada flor amarillas
        const frasesAmor = [
            "Te amo mucho ❤️", 
            "Eres mi gordis linda ✨", 
            "Mi lugar favorito eres tú 🌻", 
            "Pensando en ti cada segundo 💭", 
            "Me haces muy feliz 🥰", 
            "Un universo entero para ti 🌌", 
            "Eres única y especial 💛", 
            "Gracias por existir 👑", 
            "Te extraño a cada momento 🥺", 
            "Te adoro con todo mi corazón 🌹", 
            "Eres mi persona favorita 🧸", 
            "Siempre tú y yo ♾️"
        ];

        // Fondo de estrellas
        const starsBg = document.getElementById('stars-bg');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsBg.appendChild(star);
        }

        // Armar pétalos circulares
        function buildPetals(flowerDiv, count) {
            const petalsContainer = document.createElement('div');
            petalsContainer.style.position = 'absolute';
            petalsContainer.style.width = '100%';
            petalsContainer.style.height = '100%';
            const angleStep = 360 / count;
            for (let i = 0; i < count; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.transform = `rotate(${i * angleStep}deg)`;
                petalsContainer.appendChild(petal);
            }
            flowerDiv.appendChild(petalsContainer);
        }

        function crearUniversoMensajes() {
            // Desvanecer y quitar por completo la carta para que solo quede el espacio
            const carta = document.getElementById('card-inicio');
            carta.style.opacity = '0';
            carta.style.transform = 'scale(0.5)';
            setTimeout(() => { carta.style.display = 'none'; }, 800);

            const contenedor = document.getElementById('universe-container');

            // Generador de flores y mensajes a su alrededor
            setInterval(() => {
                const randomChoice = Math.random();

                if (randomChoice < 0.70) {
                    // Crear grupo flotante (Mensaje + Flor)
                    const grupo = document.createElement('div');
                    grupo.classList.add('botanic-group');

                    // Definir coordenadas aleatorias alrededor de la pantalla (Efecto 360)
                    const startX = Math.random() * 100 + "vw";
                    const startY = Math.random() * 100 + "vh";
                    const endX = (Math.random() * 200 - 50) + "vw";
                    const endY = (Math.random() * 200 - 50) + "vh";

                    grupo.style.setProperty('--startX', startX);
                    grupo.style.setProperty('--startY', startY);
                    grupo.style.setProperty('--endX', endX);
                    grupo.style.setProperty('--endY', endY);

                    // Elegir frase al azar
                    const fraseRandom = frasesAmor[Math.floor(Math.random() * frasesAmor.length)];
                    const burbuja = document.createElement('div');
                    burbuja.classList.add('flower-msg');
                    burbuja.innerText = fraseRandom;
                    grupo.appendChild(burbuja);

                    // Elegir tipo de flor al azar (Girasol o Margarita)
                    const flor = document.createElement('div');
                    if (Math.random() < 0.5) {
                        flor.classList.add('girasol');
                        flor.innerHTML = '<div class="center"></div>';
